name: Lightweight syntax validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python source
        run: python -m compileall -q train.py evaluate.py app.py tomatolab scripts tests
      - name: Validate Colab notebook
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          notebook = json.loads(Path("notebooks/TomatoLab_Colab.ipynb").read_text(encoding="utf-8"))
          for cell in notebook["cells"]:
              if cell["cell_type"] == "code":
                  ast.parse("".join(cell["source"]))
          print("Notebook cells parsed successfully")
          PY
